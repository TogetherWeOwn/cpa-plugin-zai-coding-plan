name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test release validation
        run: make test-release
      - name: Validate release source
        run: make validate-source
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  build:
    name: Linux amd64 shared library
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Package plugin
        run: make package VERSION=0.0.1
      - name: Verify plugin-store artifact
        run: |
          set -euo pipefail
          library="dist/zai-coding-plan-v0.0.1.so"
          archive="dist/zai-coding-plan_0.0.1_linux_amd64.zip"
          test -s "$library"
          nm -D "$library" | grep -Eq '[[:space:]]cliproxy_plugin_init$'
          test "$(unzip -Z1 "$archive")" = "zai-coding-plan.so"
          cmp "$library" <(unzip -p "$archive" zai-coding-plan.so)
          make validate-release VERSION=0.0.1 TAG=v0.0.1
