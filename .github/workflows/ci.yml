name: CI

on:
  push:
    branches: [main, release-recovery/v0.1.0]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test deployment regressions
        run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Test deployment acceptance
        run: ./deploy/acceptance_local.py
      - name: Test release validation
        run: make test-release
      - name: Validate release source
        run: make validate-source
      - name: Scan repository with gitleaks
        run: make scan-secrets
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  build:
    name: Linux amd64 shared library
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Package plugin
        run: make package VERSION=0.1.0
      - name: Verify plugin-store artifact
        run: |
          set -euo pipefail
          library="dist/zai-coding-plan-v0.1.0.so"
          archive="dist/zai-coding-plan_0.1.0_linux_amd64.zip"
          test -s "$library"
          nm -D "$library" | grep -Eq '[[:space:]]cliproxy_plugin_init$'
          test "$(unzip -Z1 "$archive")" = "zai-coding-plan.so"
          cmp "$library" <(unzip -p "$archive" zai-coding-plan.so)
          make validate-release VERSION=0.1.0 TAG=v0.1.0
      - name: Extract approved host image
        id: host
        run: |
          set -euo pipefail
          host=$(.github/scripts/extract-host-image.sh .github/release-host-image.json "$RUNNER_TEMP/host-image")
          printf 'binary=%s\n' "$host" >> "$GITHUB_OUTPUT"
      - name: Test approved host image
        run: make test-host-image VERSION=0.1.0 HOST_BINARY='${{ steps.host.outputs.binary }}'
