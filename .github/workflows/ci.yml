name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test release validation
        run: make test-release
      - name: Validate release source
        run: make validate-source
      - name: Scan repository with gitleaks
        run: make scan-secrets
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  build:
    name: Linux amd64 shared library
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve immutable host image matrix
        run: .github/scripts/resolve-host-images.sh > "$RUNNER_TEMP/host-images.json"
      - name: Package plugin
        run: make package VERSION=0.2.0 COMPATIBILITY_EVIDENCE="$RUNNER_TEMP/host-images.json"
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          library="dist/zai-coding-plan-v0.2.0.so"
          archive="dist/zai-coding-plan_0.2.0_linux_amd64.zip"
          test -s "$library"
          nm -D "$library" | grep -Eq '[[:space:]]cliproxy_plugin_init$'
          test "$(unzip -Z1 "$archive")" = "zai-coding-plan.so"
          cmp "$library" <(unzip -p "$archive" zai-coding-plan.so)
          make validate-release VERSION=0.2.0 TAG=v0.2.0
      - name: Test host compatibility matrix
        env:
          HOST_MATRIX_NAMESPACE: root
        run: sudo --preserve-env=HOST_MATRIX_NAMESPACE make test-host-matrix VERSION=0.2.0 OUT=dist/zai-coding-plan-v0.2.0.so HOST_IMAGES="$RUNNER_TEMP/host-images.json" HOST_MATRIX_WORK="$RUNNER_TEMP/host-matrix"
