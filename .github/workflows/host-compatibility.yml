name: Host compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Deployed, latest, and baseline host images
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve immutable image matrix
        run: .github/scripts/resolve-host-images.sh > "$RUNNER_TEMP/host-images.json"
      - name: Build plugin
        run: make build VERSION=0.2.0 OUT=dist/zai-coding-plan-v0.2.0.so
      - name: Run compatibility matrix
        run: make test-host-matrix VERSION=0.2.0 OUT=dist/zai-coding-plan-v0.2.0.so HOST_IMAGES="$RUNNER_TEMP/host-images.json" HOST_MATRIX_WORK="$RUNNER_TEMP/host-matrix"
