name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Verify
        run: |
          make fmt-check
          make vet
          make test
          make test-release
          make validate-source
          make lint
      - name: Package
        run: make package VERSION="$VERSION"
      - name: Verify plugin-store artifact
        run: |
          set -euo pipefail
          library="dist/zai-coding-plan-v${VERSION}.so"
          archive="dist/zai-coding-plan_${VERSION}_linux_amd64.zip"
          nm -D "$library" | grep -Eq '[[:space:]]cliproxy_plugin_init$'
          test "$(unzip -Z1 "$archive")" = "zai-coding-plan.so"
          cmp "$library" <(unzip -p "$archive" zai-coding-plan.so)
          make validate-release VERSION="$VERSION" TAG="$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/zai-coding-plan_${VERSION}_linux_amd64.zip" dist/checksums.txt --verify-tag --generate-notes
