name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify
        run: |
          make fmt-check
          make vet
          make test
          make lint
      - name: Package
        run: make package VERSION="$VERSION"
      - name: Verify checksums
        run: cd dist && sha256sum --check checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/zai-coding-plan-v${VERSION}.so" dist/checksums.txt --verify-tag --generate-notes
