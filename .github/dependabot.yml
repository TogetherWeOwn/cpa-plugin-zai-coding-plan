version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The release contract baselines on a schema-5-capable v7.2.150 host
      # (TOG-7425). Keep major and minor changes out of automated PRs, and
      # suppress schema-6 SDK patches until the baseline moves past schema 5;
      # 7.2.151 is the deferral-era rejection superseded by this manual bump.
      - dependency-name: github.com/router-for-me/CLIProxyAPI/v7
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: github.com/router-for-me/CLIProxyAPI/v7
        versions:
          - 7.2.151
          - 7.2.155
          - 7.2.156
          - 7.2.157
          - 7.2.158
          - 7.2.159
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
